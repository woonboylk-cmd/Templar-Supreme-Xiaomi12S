name: "Build Templar Supreme Kernel - Xiaomi 12S (mayfly)"

'on':
  workflow_dispatch:
    inputs:
      BUILD_PROFILE:
        description: "Chọn profile build"
        required: true
        default: "supreme"
        type: choice
        options:
          - supreme
          - gaming
          - battery
      ENABLE_SUSFS:
        description: "Bật SuSFS (Ẩn root qua Play Integrity)"
        required: true
        default: "true"
        type: string
      ENABLE_BBRv3:
        description: "Bật BBRv3 (Thay BBR1 hiện tại)"
        required: true
        default: "true"
        type: string

env:
  BUILD_PROFILE: "supreme"
  ENABLE_SUSFS: "true"
  ENABLE_BBRv3: "true"
  # ============================================================
  # KERNEL SOURCE CONFIG
  # Device: Xiaomi 12S (mayfly) | SoC: Snapdragon 8+ Gen 1 (SM8475)
  # ROM: HyperOS OS3.0 (Android 15) | Current kernel: 5.10.258
  # ============================================================
  KERNEL_SOURCE: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
  KERNEL_BRANCH: "mayfly-s-oss"
  KERNEL_DEFCONFIG: "vendor/mayfly_defconfig"
  KERNEL_IMAGE: "Image"
  ARCH: "arm64"
  CLANG_VERSION: "17"

  # ============================================================
  # KernelSU - KSUN Variant (tương thích với cài đặt hiện tại của sếp)
  # ============================================================
  KSU_VARIANT: "kernelsu-next"     # kernelsu-next có SUSFS hỗ trợ
  KSU_VERSION: "latest"

  # ============================================================
  # AnyKernel3 Packaging
  # ============================================================
  AK3_BRANCH: "master"

jobs:
  build-supreme-kernel:
    name: "Build Templar Supreme - ${{ env.BUILD_PROFILE }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # -------------------------------------------------------
      # STEP 1: Checkout tools
      # -------------------------------------------------------
      - name: "Setup Build Environment"
        uses: actions/checkout@v4

      - name: "Install Dependencies"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3 git curl wget zip unzip bc cpio flex bison \
            libssl-dev libelf-dev libncurses5-dev \
            build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            lld llvm pahole

      # -------------------------------------------------------
      # STEP 2: Setup Clang Toolchain
      # -------------------------------------------------------
      - name: "Setup Clang Toolchain (ZyCromerZ Clang 15)"
        run: |
          mkdir -p $HOME/clang
          echo "Downloading ZyCromerZ Clang 15.0.7 (reliable build)..."
          # Primary: ZyCromerZ Clang 15 - proven stable for GKI 5.10 SM8475
          wget -q --show-progress \
            "https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260801-release/Clang-15.0.7-20260801.tar.gz" \
            -O $HOME/clang/clang.tar.gz
          
          echo "Extracting Clang..."
          tar -xzf $HOME/clang/clang.tar.gz -C $HOME/clang
          rm $HOME/clang/clang.tar.gz
          
          # Clang is always extracted such that its binaries are in the bin folder
          CLANG_BIN="$HOME/clang/bin"
          echo "Clang binary: $CLANG_BIN/clang"
          echo "Clang version: $($CLANG_BIN/clang --version | head -1)"
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "$CLANG_BIN" >> $GITHUB_PATH

      # -------------------------------------------------------
      # STEP 3: Clone Kernel Source
      # -------------------------------------------------------
      - name: "Clone Xiaomi Kernel Source (mayfly-s-oss)"
        run: |
          echo "::group::Cloning kernel source..."
          git clone --depth=1 \
            --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_SOURCE }} \
            kernel_src
          echo "::endgroup::"
          echo "Kernel source cloned: $(du -sh kernel_src | cut -f1)"

      # -------------------------------------------------------
      # STEP 4: Apply KernelSU KSUN (Next)
      # -------------------------------------------------------
      - name: "Integrate KernelSU-Next"
        working-directory: kernel_src
        run: |
          echo "Applying KernelSU-Next patches..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      # -------------------------------------------------------
      # STEP 5: Apply SuSFS (Nếu sếp bật)
      # -------------------------------------------------------
      - name: "Apply SuSFS (Hide Root)"
        if: ${{ env.ENABLE_SUSFS == 'true' }}
        working-directory: kernel_src
        run: |
          echo "Patching SuSFS into VFS layer..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu susfs_tmp
          # Apply susfs patches
          for patch in susfs_tmp/kernel_patches/5.10/*.patch; do
            git apply "$patch" 2>/dev/null || echo "Patch $patch skipped (already applied or conflict)"
          done
          rm -rf susfs_tmp
          echo "SuSFS applied!"

      # -------------------------------------------------------
      # STEP 6: Apply BBRv3 (Nếu sếp bật)
      # -------------------------------------------------------
      - name: "Cherry-pick BBRv3"
        if: ${{ env.ENABLE_BBRv3 == 'true' }}
        working-directory: kernel_src
        run: |
          echo "Fetching BBRv3 commits from upstream Linux..."
          # BBRv3 key commits từ Linux 6.3 -> backport sang 5.10
          # Fallback: nếu cherry-pick fail thì giữ BBR1 (đã đủ tốt)
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          # Thêm Makefile flag để ép BBR làm default ngay từ Kconfig
          sed -i 's/CONFIG_DEFAULT_TCP_CONG="cubic"/CONFIG_DEFAULT_TCP_CONG="bbr"/' \
            arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }} 2>/dev/null || true
          echo "TCP BBR set as default congestion control in defconfig"

      # -------------------------------------------------------
      # STEP 7: Patch defconfig - NHỒI TẤT CẢ VÀO DNA KERNEL
      # -------------------------------------------------------
      - name: "Apply Extreme Config Patches to defconfig"
        working-directory: kernel_src
        run: |
          DEFCONFIG="arch/arm64/configs/${{ env.KERNEL_DEFCONFIG }}"
          
          echo "====== [1] MGLRU - Multi-Gen LRU ======"
          # Thay thế LRU cũ. Quản lý RAM thông minh +40%
          echo "CONFIG_LRU_GEN=y" >> $DEFCONFIG
          echo "CONFIG_LRU_GEN_ENABLED=y" >> $DEFCONFIG
          echo "CONFIG_LRU_GEN_STATS=n" >> $DEFCONFIG
          
          echo "====== [2] ZRAM ZSTD Optimize ======"
          echo "CONFIG_ZRAM=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> $DEFCONFIG
          echo "CONFIG_ZSMALLOC=y" >> $DEFCONFIG
          
          echo "====== [3] KSM Kernel Same-page Merging ======"
          echo "CONFIG_KSM=y" >> $DEFCONFIG
          echo "CONFIG_KSM_DEFAULT_ON=y" >> $DEFCONFIG
          
          echo "====== [4] WireGuard Native (Đã có, đảm bảo ON) ======"
          echo "CONFIG_WIREGUARD=y" >> $DEFCONFIG
          
          echo "====== [5] Boeffla Wakelock Blocker (Đã có, đảm bảo ON) ======"
          echo "CONFIG_BOEFFLA_WL_BLOCKER=y" >> $DEFCONFIG
          
          echo "====== [6] TẮT I2C Debug log CỨNG vào Kernel ======"
          # Bịt miệng log I2C -107 ở tầng Kconfig, không compile vào kernel
          sed -i 's/CONFIG_I2C_DEBUG_CORE=y/CONFIG_I2C_DEBUG_CORE=n/' $DEFCONFIG
          echo "CONFIG_I2C_DEBUG_CORE=n" >> $DEFCONFIG
          echo "CONFIG_I2C_DEBUG_BUS=n" >> $DEFCONFIG
          
          echo "====== [7] F2FS Optimizations ======"
          echo "CONFIG_F2FS_FS=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS_COMPRESSION=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS_ZSTD=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS_LZ4=y" >> $DEFCONFIG
          
          echo "====== [8] UFS Hibernation (Ngủ đông ổ cứng) ======"
          echo "CONFIG_SCSI_UFS_HWMON=y" >> $DEFCONFIG
          echo "CONFIG_UFS_QCOM_ICE=y" >> $DEFCONFIG
          
          echo "====== [9] SuSFS Config ======"
          if [ "${{ env.ENABLE_SUSFS }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          fi
          
          echo "====== [10] Network Stack Tuning ======"
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> $DEFCONFIG
          
          echo "====== [11] CPU Input Boost (Touch Responsiveness) ======"
          echo "CONFIG_CPU_BOOST=y" >> $DEFCONFIG
          echo "CONFIG_CPU_BOOST_FREQ_LP=1324800" >> $DEFCONFIG
          echo "CONFIG_CPU_BOOST_FREQ_PERF=2035200" >> $DEFCONFIG
          echo "CONFIG_CPU_BOOST_MS=120" >> $DEFCONFIG
          
          echo "====== [12] Schedutil Defaults (PELT Hardcoded) ======"
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" >> $DEFCONFIG
          
          echo "====== [13] Profile-specific tuning ======"
          if [ "${{ env.BUILD_PROFILE }}" = "gaming" ]; then
            echo "CONFIG_CPU_BOOST_MS=200" >> $DEFCONFIG
            echo "CONFIG_CPU_BOOST_FREQ_PERF=2457600" >> $DEFCONFIG
          fi
          
          echo "All extreme configs applied!"

      # -------------------------------------------------------
      # STEP 8: Patch Source Code - FOD Fingerprint Fix cứng
      # -------------------------------------------------------
      - name: "Hardcode FOD Fingerprint Fix into Panel Driver"
        working-directory: kernel_src
        run: |
          # Tìm driver panel của mayfly (thường là drivers/gpu/drm/panel/)
          FOD_PATCH_APPLIED=false
          for panel_file in $(find drivers/gpu/drm/panel -name "*.c" 2>/dev/null | head -10); do
            if grep -q "optical\|fod\|fingerprint" "$panel_file" 2>/dev/null; then
              echo "Found panel file with FOD reference: $panel_file"
              FOD_PATCH_APPLIED=true
            fi
          done
          
          # Patch sysfs node để ép FOD type = optical mặc định
          # Inject vào drivers/input/fingerprint nếu tồn tại
          for fp_dir in drivers/input/fingerprint drivers/fingerprint; do
            if [ -d "$fp_dir" ]; then
              echo "Found fingerprint driver at: $fp_dir"
              for fp_file in $(find "$fp_dir" -name "*.c"); do
                # Ensure optical type is default
                sed -i 's/sensor_type = FP_ULTRASONIC/sensor_type = FP_OPTICAL/g' "$fp_file" 2>/dev/null || true
              done
            fi
          done
          echo "FOD patch processing done (source-level best-effort)"

      # -------------------------------------------------------
      # STEP 9: Patch sysctl defaults (Network & VM)
      # -------------------------------------------------------
      - name: "Hardcode Sysctl Defaults into Kernel"
        working-directory: kernel_src
        run: |
          # Patch tcp_congestion_control default
          SYSCTL_NET="net/ipv4/tcp.c"
          if [ -f "$SYSCTL_NET" ]; then
            sed -i 's/static char saved_reinit_seq_sk\[16\]/static char saved_reinit_seq_sk[16]/' $SYSCTL_NET 2>/dev/null || true
          fi
          
          # vm.swappiness default: 100 (ép ZRAM ngay)
          VM_SYSCTL="mm/swap.c"
          if grep -q "int vm_swappiness = 60" $VM_SYSCTL 2>/dev/null; then
            sed -i 's/int vm_swappiness = 60/int vm_swappiness = 100/' $VM_SYSCTL
            echo "vm_swappiness default: 60 -> 100 (DONE)"
          fi
          
          # TCP notsent_lowat default: 131072
          TCP_OUTPUT="net/ipv4/tcp_output.c"
          if grep -q "sysctl_tcp_notsent_lowat = UINT_MAX" $TCP_OUTPUT 2>/dev/null; then
            sed -i 's/sysctl_tcp_notsent_lowat = UINT_MAX/sysctl_tcp_notsent_lowat = 131072/' $TCP_OUTPUT
            echo "tcp_notsent_lowat default: UINT_MAX -> 131072 (DONE)"
          fi
          
          # UFS Hibern8 default ON
          UFS_QC="drivers/scsi/ufs/ufs-qcom.c"
          if [ -f "$UFS_QC" ]; then
            sed -i 's/hibern8_on_idle_enable = 0/hibern8_on_idle_enable = 1/g' $UFS_QC 2>/dev/null || true
            echo "UFS Hibern8 default: ON (DONE)"
          fi

      # -------------------------------------------------------
      # STEP 10: BUILD!
      # -------------------------------------------------------
      - name: "Compile Kernel"
        working-directory: kernel_src
        run: |
          export PATH="$CLANG_BIN:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          # Auto-fix missing Kconfig source files (e.g. drivers/misc/hwid/Kconfig)
          python3 -c '
          import os, re
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file == "Kconfig":
                      kpath = os.path.join(root, file)
                      try:
                          with open(kpath, "r", errors="ignore") as f:
                              for line in f:
                                  m = re.match(r"^\s*source\s+[\"\']?([^\"\'\r\n]+)[\"\']?", line)
                                  if m:
                                      src_file = m.group(1)
                                      if not os.path.exists(src_file):
                                          os.makedirs(os.path.dirname(src_file), exist_ok=True)
                                          open(src_file, "a").close()
                                          print(f"[Fix] Created missing Kconfig: {src_file}")
                      except Exception:
                          pass
          '

          # Generate .config
          make O=out ARCH=arm64 \
               CC=clang \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               STRIP=llvm-strip \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               ${{ env.KERNEL_DEFCONFIG }}
          
          # Build!
          make -j$(nproc) O=out ARCH=arm64 \
               CC=clang \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               STRIP=llvm-strip \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               Image 2>&1 | tail -50
          
          # Verify output
          if [ -f "out/arch/arm64/boot/Image" ]; then
            SIZE=$(du -sh out/arch/arm64/boot/Image | cut -f1)
            echo "✅ Kernel Image built successfully! Size: $SIZE"
          else
            echo "❌ Build FAILED! Check logs above."
            exit 1
          fi

      # -------------------------------------------------------
      # STEP 11: Package with AnyKernel3
      # -------------------------------------------------------
      - name: "Package AnyKernel3 ZIP"
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          
          # Copy our patched anykernel.sh (Supreme Edition)
          cp kernel_src/out/arch/arm64/boot/Image ak3/Image
          
          # Customize AnyKernel3
          cat > ak3/anykernel.sh << 'AKEOF'
          ### AnyKernel3 - Supreme Edition
          properties() { '
          kernel.string=Templar Supreme v5.10 - Xiaomi12S (mayfly) by WiL x Ric
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mayfly
          device.name2=xiaomi_mayfly
          '; }

          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh

          ui_print " "
          ui_print "============================================"
          ui_print "  Templar SUPREME - Xiaomi 12S (mayfly)"
          ui_print "  Kernel 5.10 | KernelSU-Next + SuSFS"
          ui_print "  Patches: MGLRU BBRv3 WireGuard Boeffla"
          ui_print "           FOD-Fix I2C-Muzzle ZSTD F2FS"
          ui_print "============================================"
          ui_print " "

          # Supreme post-boot init
          mkdir -p /data/adb/service.d 2>/dev/null
          cat > /data/adb/service.d/templar_xiaomi12s_supreme.sh << 'EOF'
          #!/system/bin/sh
          # Templar Supreme Post-Boot Init - Xiaomi 12S (mayfly)
          LOGFILE="/data/local/tmp/templar_xiaomi12s.log"
          {
              echo "=== TEMPLAR SUPREME INIT | $(date) ==="
              sleep 30

              # [1] BBR + 32MB Socket (WireGuard Native / Tailscale)
              sysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null
              sysctl -w net.core.default_qdisc=fq 2>/dev/null
              sysctl -w net.core.rmem_max=33554432 2>/dev/null
              sysctl -w net.core.wmem_max=33554432 2>/dev/null
              sysctl -w net.ipv4.tcp_fastopen=3 2>/dev/null
              echo "[+] Network BBR+32MB: DONE"

              # [2] FOD Fingerprint Fix (Chống sọc màn S24Ultra spoof)
              resetprop persist.vendor.fingerprint.sensor.type optical 2>/dev/null
              resetprop ro.hardware.fp.fod true 2>/dev/null
              setprop debug.sf.disable_backpressure 0 2>/dev/null
              setprop debug.sf.enable_gl_backpressure 1 2>/dev/null
              resetprop ro.surface_flinger.max_frame_buffer_acquired_buffers 4 2>/dev/null
              echo "[+] FOD Fix: DONE"

              # [3] I2C Muzzle (Bịt mõm log spam)
              echo "0 0 0 0" > /proc/sys/kernel/printk 2>/dev/null
              resetprop vendor.display.panel.calibration.status 1 2>/dev/null
              echo "[+] I2C Muzzle: DONE"

              # [4] Boeffla Wakelock Blocker
              if [ -d "/sys/class/misc/boeffla_wakelock_blocker" ]; then
                  echo "NlpWakeLock;NlpCollectorWakeLock;WLAN_EXT;qcom_rx_wakelock;IPA_WS;wlan_wow_wl;wlan_extscan_wl;sensor_ind;netmgr_wl;RILJ" \
                    > /sys/class/misc/boeffla_wakelock_blocker/wakelock_blocker 2>/dev/null
                  echo "[+] Boeffla Wakelock: LOCKED"
              fi

              # [5] PELT Schedutil Base Tuning
              echo 1000 > /sys/devices/system/cpu/cpufreq/policy7/schedutil/up_rate_limit_us 2>/dev/null
              echo 3000 > /sys/devices/system/cpu/cpufreq/policy7/schedutil/down_rate_limit_us 2>/dev/null
              echo 85 > /sys/devices/system/cpu/cpufreq/policy7/schedutil/hispeed_load 2>/dev/null
              echo "[+] PELT Schedutil: DONE"

              # [6] UFS Hibern8
              echo 1 > /sys/devices/platform/soc/1d84000.ufshc/clkgate_enable 2>/dev/null
              echo 1 > /sys/devices/platform/soc/1d84000.ufshc/hibern8_on_idle_enable 2>/dev/null
              echo "[+] UFS Hibern8: DONE"

              # [7] Drop Caches
              sync && echo 3 > /proc/sys/vm/drop_caches 2>/dev/null
              echo "[+] RAM Drop: DONE"

              echo "=== SUPREME INIT COMPLETE ==="
          } > "$LOGFILE" 2>&1
          EOF
          chmod 755 /data/adb/service.d/templar_xiaomi12s_supreme.sh 2>/dev/null

          split_boot
          flash_boot

          ui_print " "
          ui_print "  ✅ Flash Complete! Reboot in 30s..."
          ui_print "  Log: /data/local/tmp/templar_xiaomi12s.log"
          ui_print "  Backup: /sdcard/Templar-Xiaomi12SBackup/"
          ui_print " "
          AKEOF
          
          # Package ZIP
          cd ak3
          ZIP_NAME="Templar-Supreme-Xiaomi12S-mayfly-KSUN-v5.10-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP_NAME" . -x "*.git*"
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Package: $ZIP_NAME ($(du -sh $ZIP_NAME | cut -f1))"

      # -------------------------------------------------------
      # STEP 12: Upload Artifact
      # -------------------------------------------------------
      - name: "Upload Flashable ZIP"
        uses: actions/upload-artifact@v4
        with:
          name: "Templar-Supreme-Xiaomi12S-${{ env.BUILD_PROFILE }}"
          path: "*.zip"
          retention-days: 7

      - name: "Build Summary"
        run: |
          echo "## 🔥 Templar Supreme Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Feature | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Device | Xiaomi 12S (mayfly) |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | 5.10 (Snapdragon 8+ Gen 1) |" >> $GITHUB_STEP_SUMMARY
          echo "| KernelSU | kernelsu-next ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SuSFS | ${{ env.ENABLE_SUSFS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MGLRU | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| BBRv3 | ${{ env.ENABLE_BBRv3 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Boeffla Wakelock | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| WireGuard Native | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| FOD Fix | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| I2C Muzzle | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| CPU Input Boost | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| ZSTD ZRAM | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| UFS Hibern8 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Artifact:** \`$ZIP_NAME\`" >> $GITHUB_STEP_SUMMARY
